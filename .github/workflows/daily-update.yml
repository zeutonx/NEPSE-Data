name: Daily NEPSE data update

on:
  schedule:
    # 12:15 UTC = 18:00 Nepal time (UTC+05:45), after NEPSE closes at 15:00
    - cron: "15 12 * * *"
  workflow_dispatch: {}
  # on pull requests: run everything as a live check, but don't commit
  pull_request:
    paths: ["sharesansar/**", "tests/**", "requirements.txt", ".github/workflows/daily-update.yml"]

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        run: python -m pytest -q tests

      - name: Update indices, gold/silver and forex
        run: python -m sharesansar market

      - name: Save latest share prices
        run: python -m sharesansar prices --split

      - name: Commit updated data
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -f data/market data/prices
          if git diff --cached --quiet; then
            echo "No data changes today."
            exit 0
          fi
          git commit -m "Daily data update $(TZ=Asia/Kathmandu date +%Y-%m-%d)"
          git push
